<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Family Survivors — Art Demo v0.00013</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #0d0a04;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, "PingFang HK", "Segoe UI", sans-serif;
    }
    #openHelp {
      position: fixed; inset: 0; z-index: 10;
      box-sizing: border-box;
      padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      background: #1a1408;
      color: #fff8e0;
      overflow: auto;
    }
    #openHelp h1 { font-size: 28px; margin: 0 0 14px; color: #ffe066; }
    #stage {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      align-items: center;
      justify-content: center;
      background: #0d0a04;
      touch-action: none;
    }
    #game {
      display: block;
      width: 320px;
      height: 180px;
      background: #3d6b2e;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      flex-shrink: 0;
    }
    #hint {
      display: none;
      position: fixed; left: 8px; right: 8px; bottom: 6px;
      z-index: 2;
      color: rgba(255,255,240,.45);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 2px #000;
    }
    #verBadge {
      display: none;
      position: fixed; top: max(6px, env(safe-area-inset-top)); right: 8px;
      z-index: 3;
      color: #ffe066;
      background: rgba(0,0,0,.55);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 8px;
      pointer-events: none;
    }
    #softTip {
      display: none;
      position: fixed;
      left: 50%;
      top: max(40px, env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 4;
      background: rgba(0,0,0,.7);
      color: #ffe066;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 10px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="openHelp">
    <h1>載入中…</h1>
    <p>請用瀏覽器開啟（唔好用檔案預覽）。</p>
  </div>
  <div id="stage">
    <canvas id="game" width="1920" height="1080"></canvas>
  </div>
  <div id="verBadge">v0.00013</div>
  <div id="softTip">建議打橫玩 · 直機會留黑邊</div>
  <div id="hint">左半＝P1 女兒 · 右半＝P2 爸爸 · 等比 16:9 · v0.00013</div>
  <script>
  (function () {
    try {
      var h = document.getElementById('openHelp');
      if (h) h.innerHTML = '<h1 style="color:#8f8">JS 已啟動…</h1>';
      window.__ART_DEMO_JS__ = true;
    } catch (e) {}
  })();
  </script>
  <script src="js/spriteUtil.js?v=00013"></script>
  <script src="js/characters/daughter.js?v=00013"></script>
  <script src="js/characters/dad.js?v=00013"></script>
  <script src="js/main.js?v=00013"></script>
</body>
</html>
