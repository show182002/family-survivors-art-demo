<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <title>Family Survivors — Art Demo v0.00010</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #0d0a04;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, "PingFang HK", "Segoe UI", sans-serif;
    }
    #openHelp {
      position: fixed; inset: 0; z-index: 10;
      box-sizing: border-box;
      padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      background: #1a1408;
      color: #fff8e0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    #openHelp h1 { font-size: 28px; margin: 0 0 14px; color: #ffe066; }
    #openHelp p { font-size: 18px; line-height: 1.55; margin: 0 0 12px; }
    #openHelp .box {
      background: #3a2a10; border: 2px solid #ffe066; border-radius: 14px;
      padding: 16px; margin: 16px 0;
    }
    #openHelp ol { font-size: 18px; line-height: 1.7; padding-left: 1.3em; margin: 8px 0; }
    #openHelp .ok { color: #8f8; font-size: 15px; margin-top: 18px; }
    #stage {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      align-items: center;
      justify-content: center;
      background: #0d0a04;
      touch-action: none;
    }
    #game {
      display: block;
      /* JS sets exact pixel CSS size with one scale — never set conflicting CSS size here */
      width: 320px;
      height: 180px;
      background: #3d6b2e;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      flex-shrink: 0;
    }
    #hint {
      display: none;
      position: fixed; left: 8px; right: 8px; bottom: 6px;
      z-index: 2;
      color: rgba(255,255,240,.45);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 2px #000;
    }
    #verBadge {
      display: none;
      position: fixed; top: max(6px, env(safe-area-inset-top)); right: 8px;
      z-index: 3;
      color: #ffe066;
      background: rgba(0,0,0,.55);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="openHelp">
    <h1>而家仲未開到遊戲</h1>
    <div class="box">
      <p><b>你而家好可能係用「檔案預覽」睇緊呢個 HTML。</b></p>
      <p>預覽只會顯示底色（綠色），<b>唔會跑 JavaScript</b>，所以無角色、無搖桿。</p>
    </div>
    <p><b>請用瀏覽器開啟</b>（分享 → Chrome / Safari）。建議橫機。</p>
    <noscript><p style="color:#f66;font-size:20px;margin-top:20px">呢個環境關閉咗 JavaScript，遊戲一定開唔到。</p></noscript>
  </div>

  <div id="stage">
    <canvas id="game" width="1920" height="1080"></canvas>
  </div>
  <div id="verBadge">v0.00010</div>
  <div id="hint">左半＝P1 女兒 · 右半＝P2 爸爸 · 等比 16:9 · v0.00010</div>

  <script>
  (function () {
    try {
      var h = document.getElementById('openHelp');
      if (h) h.innerHTML = '<h1 style="color:#8f8">JS 已啟動…</h1><p>載入中</p>';
      window.__ART_DEMO_JS__ = true;
    } catch (e) {}
  })();
  </script>
  <script src="js/spriteUtil.js?v=00010"></script>
  <script src="js/characters/daughter.js?v=00010"></script>
  <script src="js/characters/dad.js?v=00010"></script>
  <script src="js/main.js?v=00010"></script>
  <script>
  (function () {
    setTimeout(function () {
      if (!window.__ART_DEMO_RUNNING__) {
        var h = document.getElementById('openHelp');
        if (h) {
          h.style.display = 'block';
          h.innerHTML = '<h1 style="color:#f66">遊戲啟動失敗</h1><p>請用 Chrome / Safari 開啟。</p><p>v0.00010</p>';
        }
      }
    }, 1200);
  })();
  </script>
</body>
</html>
