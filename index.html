<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Family Survivors — Art Demo v0.00018</title>
  <style>
    :root {
      --vvw: 100vw;
      --vvh: 100vh;
    }
    html {
      margin: 0;
      padding: 0;
      /* Document taller than screen → Safari can collapse address bar on scroll */
      min-height: 100%;
      min-height: calc(100dvh + 1px);
      background: #0d0a04;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: calc(100dvh + 120px);
      background: #0d0a04;
      /* allow programmatic + tiny user scroll for chrome collapse */
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, "PingFang HK", "Segoe UI", sans-serif;
    }
    /* Invisible pad so scrollHeight > visualViewport (classic “page bigger than screen”) */
    #scrollSpacer {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 150vh;
      height: calc(100dvh + 140px);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
    }
    /* All UI pinned to visualViewport so game doesn't scroll away */
    #shell {
      position: fixed;
      left: 0;
      top: 0;
      width: var(--vvw, 100%);
      height: var(--vvh, 100%);
      z-index: 1;
      overflow: hidden;
      touch-action: none;
      background: #0d0a04;
    }
    #openHelp {
      position: absolute; inset: 0; z-index: 10;
      box-sizing: border-box;
      padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      background: #1a1408;
      color: #fff8e0;
      overflow: auto;
    }
    #openHelp h1 { font-size: 28px; margin: 0 0 14px; color: #ffe066; }
    #stage {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      align-items: center;
      justify-content: center;
      background: #0d0a04;
      touch-action: none;
    }
    #game {
      display: block;
      /* 16:9 contain against visualViewport vars (JS updates --vvw/--vvh) */
      width: min(var(--vvw), calc(var(--vvh) * 16 / 9));
      height: min(var(--vvh), calc(var(--vvw) * 9 / 16));
      max-width: 100%;
      max-height: 100%;
      background: #3d6b2e;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      flex-shrink: 0;
    }
    #hint {
      display: none;
      position: absolute; left: 8px; right: 8px; bottom: 6px;
      z-index: 2;
      color: rgba(255,255,240,.45);
      font-size: 11px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 2px #000;
    }
    #verBadge {
      display: none;
      position: absolute; top: max(6px, env(safe-area-inset-top)); right: 8px;
      z-index: 3;
      color: #ffe066;
      background: rgba(0,0,0,.55);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 8px;
      pointer-events: none;
      max-width: min(70vw, 280px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #trialBanner {
      display: none;
      position: absolute;
      left: 50%;
      top: max(8px, env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 5;
      background: rgba(120,40,0,.85);
      color: #ffe066;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid #ffe066;
      pointer-events: none;
      white-space: nowrap;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #softTip {
      display: none;
      position: absolute;
      left: 50%;
      top: max(40px, env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 4;
      background: rgba(0,0,0,.7);
      color: #ffe066;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 10px;
      pointer-events: none;
      white-space: nowrap;
    }
    #fsBtn {
      display: none;
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      bottom: max(28px, calc(env(safe-area-inset-bottom) + 22px));
      z-index: 20;
      min-height: 44px;
      min-width: 88px;
      padding: 10px 16px;
      border: 2px solid #ffe066;
      border-radius: 12px;
      background: rgba(0,0,0,.75);
      color: #ffe066;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,.45);
      cursor: pointer;
    }
    #fsBtn:active {
      background: rgba(40,30,0,.9);
    }

    #rotateModal {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 25;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      background: rgba(0,0,0,.72);
      pointer-events: auto;
      touch-action: manipulation;
    }
    #rotateModal .card {
      width: min(92vw, 340px);
      box-sizing: border-box;
      padding: 22px 18px 18px;
      border-radius: 16px;
      border: 2px solid #ffe066;
      background: #1a1408;
      color: #fff8e0;
      text-align: center;
      box-shadow: 0 8px 28px rgba(0,0,0,.55);
    }
    #rotateModal .icon {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 10px;
    }
    #rotateModal h2 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #ffe066;
      font-weight: 800;
    }
    #rotateModal p {
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.45;
      color: rgba(255,248,224,.85);
    }
    #fsFailTip {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      max-width: min(92vw, 360px);
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(0,0,0,.88);
      color: #ffe066;
      font-size: 15px;
      line-height: 1.45;
      text-align: center;
      pointer-events: none;
      white-space: normal;
    }
  </style>
</head>
<body>
  <div id="scrollSpacer" aria-hidden="true"></div>
  <div id="shell">
    <div id="openHelp">
      <h1>載入中…</h1>
      <p>請用瀏覽器開啟（唔好用檔案預覽）。</p>
    </div>
    <div id="stage">
      <canvas id="game" width="1920" height="1080"></canvas>
    </div>
    <div id="trialBanner">試：逼收網址列 v0.00018</div>
    <div id="verBadge">v0.00018</div>
    <div id="softTip">建議打橫玩 · 直機會留黑邊</div>
    <div id="hint">試版：頁面高過螢幕逼收網址列 · 左＝女兒 · 右＝爸爸 · v0.00018</div>
    <div id="rotateModal" role="dialog" aria-modal="true" aria-labelledby="rotateTitle">
      <div class="card">
        <div class="icon" aria-hidden="true">📱↔️</div>
        <h2 id="rotateTitle">請打橫玩</h2>
        <p>請將手機打橫先可以玩。<br>轉到橫向之後會自動開始。</p>
      </div>
    </div>
    <button type="button" id="fsBtn" aria-label="全螢幕">全螢幕</button>
    <div id="fsFailTip">呢個瀏覽器唔支援全螢幕。請用 Safari 右下「⋯」→用 Safari 開啟，再打橫。</div>
  </div>
  <script>
  (function () {
    try {
      var h = document.getElementById('openHelp');
      if (h) h.innerHTML = '<h1 style="color:#8f8">JS 已啟動…</h1>';
      window.__ART_DEMO_JS__ = true;
    } catch (e) {}
  })();
  </script>
  <script src="js/spriteUtil.js?v=00018"></script>
  <script src="js/characters/daughter.js?v=00018"></script>
  <script src="js/characters/dad.js?v=00018"></script>
  <script src="js/main.js?v=00018"></script>
</body>
</html>
